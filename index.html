<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FŇH | قائمة الانتظار</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#fff0b5">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="w">
  <div class="brand"><img class="logo" src="logo.png" alt="FŇH فنة"><h1 id="ttl" class="sr"></h1><svg class="mark" viewBox="0 0 320 40" aria-hidden="true"><circle cx="14" cy="21" r="13" fill="currentColor"/><polygon points="52,18 306,13 306,32 52,24" fill="currentColor"/></svg><p class="script">Where sunlight meets the tree</p></div>
  <p class="s">سجّل في قائمة الانتظار وسنتواصل معك عند جاهزية طاولتك</p>
  <div class="c frame" id="box">
    <label for="nm">الاسم</label><input id="nm" autocomplete="name">
    <label for="ph">رقم الجوال</label><input id="ph" type="tel" inputmode="tel" placeholder="05XXXXXXXX" autocomplete="tel">
    <label for="ct">عدد الأشخاص</label><input id="ct" type="number" inputmode="numeric" min="1" max="30" value="2">
    <div class="err" id="er"></div>
    <button class="b" id="go">تسجيل</button>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, runTransaction, writeBatch, serverTimestamp, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, PLACE_NAME } from "./firebase-config.js";
document.getElementById("ttl").textContent = PLACE_NAME;
const db = getFirestore(initializeApp(firebaseConfig));
const norm = p => { p = (p||"").replace(/[^\d]/g,"").replace(/^00/,""); if (/^05\d{8}$/.test(p)) p = "966"+p.slice(1); return p; };
const $ = id => document.getElementById(id);
const KEY = "fnh_ticket_v3";
const GRACE = 5 * 60 * 1000;
// يوم العمل ينتهي الساعة 2 فجراً بتوقيت السعودية (UTC+3)
const dayOf = ms => new Date(ms + 3 * 3600e3 - 2 * 3600e3).toISOString().slice(0, 10).replace(/-/g, "");
const rand = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("");
let stopA = null, stopB = null, timer = null;

function mmss(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function clearSaved() { try { localStorage.removeItem(KEY); } catch (e) {} }

function track(day, n, secret) {
  try { localStorage.setItem(KEY, JSON.stringify({ day, n, secret })); } catch (e) {}
  if (stopA) stopA(); if (stopB) stopB(); if (timer) clearInterval(timer);
  const id = day + "_" + n;
  let mine = null, waiting = [], confirming = false, busy = false, lastKey = "";
  $("box").innerHTML = '<div class="ok"><div class="m">رقمك</div><div class="tnum">' + n + '</div><h2 id="st">جاري التحميل...</h2><p class="s" id="ps"></p><div id="act"></div><div class="err" id="ce"></div></div>';

  async function doCancel() {
    busy = true; lastKey = ""; draw();
    try {
      const b = writeBatch(db);
      b.set(doc(db, "cancels", id), { secret });
      b.update(doc(db, "tickets", id), { status: "selfcancel" });
      await b.commit();
    } catch (e) {
      console.error(e);
      confirming = false; busy = false; lastKey = "";
      const ce = $("ce"); if (ce) ce.textContent = "تعذّر إلغاء الحجز (" + (e && e.code ? e.code : "خطأ") + "). حاول مرة ثانية.";
      draw();
    }
  }

  function setAct(key, html, bind) {
    if (key === lastKey) return;
    lastKey = key; const act = $("act"); act.innerHTML = html; if (bind) bind();
  }

  function draw() {
    if (!mine) return;
    const st = $("st"), ps = $("ps"); if (!st) return;
    const active = mine.status === "waiting" || mine.status === "called";
    if (mine.status === "waiting") {
      const ahead = waiting.filter(t => t < n).length;
      st.textContent = "ترتيبك في الانتظار: " + (ahead + 1);
      ps.textContent = ahead === 0 ? "أنت التالي، ابقَ قريباً من المكان" : "قبلك " + ahead + (ahead === 1 ? " حجز" : " حجوزات");
    } else if (mine.status === "called") {
      st.textContent = "طاولتك جاهزة الآن 🎉";
      const left = (mine.calledAt || 0) + GRACE - Date.now();
      ps.textContent = left > 0 ? "تفضّل خلال " + mmss(left) + " وإلا سيُلغى الحجز" : "انتهت المهلة";
    } else if (mine.status === "done") {
      st.textContent = "شكراً لزيارتك ☕"; ps.textContent = "نتمنى لك وقتاً طيباً في فنة";
    } else if (mine.status === "selfcancel") {
      st.textContent = "تم إلغاء حجزك"; ps.textContent = "بناءً على طلبك. نتشرف بزيارتك في وقت آخر";
    } else {
      st.textContent = "أُلغي حجزك"; ps.textContent = "تم الإلغاء لعدم الحضور في الوقت المحدد";
    }
    if (active && secret) {
      if (busy) setAct("busy", '<button class="b o" disabled>جاري الإلغاء...</button>');
      else if (confirming) setAct("confirm",
        '<p class="s" style="color:var(--dg);font-weight:700;margin:14px 0 0">هل أنت متأكد من إلغاء حجزك؟ لا يمكن التراجع.</p>' +
        '<div class="a"><button class="b" id="yes" style="background:var(--dg);color:#fff">نعم، ألغِ الحجز</button><button class="b o" id="no">رجوع</button></div>',
        () => { $("yes").onclick = doCancel; $("no").onclick = () => { confirming = false; lastKey = ""; draw(); }; });
      else setAct("ask", '<button class="b o" id="cx" style="margin-top:18px">إلغاء الحجز</button>', () => { $("cx").onclick = () => { confirming = true; lastKey = ""; draw(); }; });
    } else if (!active) {
      setAct("again", '<button class="b o" id="again" style="margin-top:18px">حجز جديد</button>', () => { $("again").onclick = () => { clearSaved(); location.reload(); }; });
    } else setAct("none", "");
  }

  stopA = onSnapshot(doc(db, "tickets", id), s => {
    if (!s.exists()) { clearSaved(); location.reload(); return; }
    mine = s.data(); draw();
  }, () => { const st = $("st"); if (st) st.textContent = "تعذّر تحديث الحالة، حدّث الصفحة"; });
  stopB = onSnapshot(query(collection(db, "tickets"), where("day", "==", day), where("status", "==", "waiting")), s => { waiting = s.docs.map(d => d.data().ticket); draw(); }, () => {});
  timer = setInterval(draw, 1000);
}

$("go").onclick = async () => {
  const name = $("nm").value.trim(), phone = norm($("ph").value), count = parseInt($("ct").value,10);
  if (!name) return $("er").textContent = "اكتب الاسم";
  if (phone.length < 9 || phone.length > 15) return $("er").textContent = "رقم الجوال غير صحيح";
  if (!count || count < 1 || count > 30) return $("er").textContent = "اكتب عدد الأشخاص (من 1 إلى 30)";
  $("er").textContent = ""; $("go").disabled = true;
  const day = dayOf(Date.now()), secret = rand();
  try {
    const n = await runTransaction(db, async tx => {
      const cref = doc(db, "counters", day);
      const snap = await tx.get(cref);
      const next = (snap.exists() ? snap.data().n : 0) + 1;
      const id = day + "_" + next;
      tx.set(cref, { n: next });
      tx.set(doc(db, "waitlist", id), { name: name.slice(0,60), phone, count, createdAt: serverTimestamp(), ticket: next, day, secret });
      tx.set(doc(db, "tickets", id), { ticket: next, day, status: "waiting", createdAt: serverTimestamp() });
      return next;
    });
    track(day, n, secret);
  } catch (e) {
    console.error(e);
    $("er").textContent = "تعذّر التسجيل (" + (e && e.code ? e.code : "خطأ") + "). تأكد من الاتصال وحاول مرة ثانية.";
    $("go").disabled = false;
  }
};

try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved && saved.day === dayOf(Date.now())) track(saved.day, saved.n, saved.secret); else if (saved) clearSaved();
} catch (e) {}
</script>
</body>
</html>
