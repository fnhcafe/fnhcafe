<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FŇH | لوحة الانتظار</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#fff0b5">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<div class="w" id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, orderBy, onSnapshot, writeBatch, serverTimestamp, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const root = document.getElementById("app");
const esc = s => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; };
let unsub = null, first = true, items = [];

function loginView() {
  if (unsub) { unsub(); unsub = null; }
  root.innerHTML = '<div class="brand sm"><img class="logo" src="logo.png" alt="FŇH"></div><h1>دخول صاحب المحل</h1><div class="c"><label for="em">البريد الإلكتروني</label><input id="em" type="email" autocomplete="username">' +
    '<label for="pw">الرقم السري</label><input id="pw" type="password" autocomplete="current-password"><div class="err" id="er"></div>' +
    '<button class="b" id="in">دخول</button></div>';
  document.getElementById("in").onclick = async () => {
    try { await signInWithEmailAndPassword(auth, document.getElementById("em").value.trim(), document.getElementById("pw").value); }
    catch (e) { document.getElementById("er").textContent = "البريد أو الرقم السري غير صحيح"; }
  };
}

function fmt(t) { try { return t.toDate().toLocaleString("ar", { dateStyle: "short", timeStyle: "short" }); } catch (e) { return ""; } }
const GRACE = 5 * 60 * 1000;
// يوم العمل ينتهي 2 فجراً بتوقيت السعودية
const dayOf = ms => new Date(ms + 3 * 3600e3 - 2 * 3600e3).toISOString().slice(0, 10).replace(/-/g, "");
const eDay = e => e.createdAt ? dayOf(e.createdAt.toMillis()) : dayOf(Date.now());
const isDone = e => e.status === "done" || e.status === "cancelled";
const isStale = e => !isDone(e) && eDay(e) !== dayOf(Date.now());
const label = e => e.status === "cancelled" ? "ملغي (تأخر)" : e.status === "done" ? "تمت خدمته" : "لم تتم خدمته (يوم سابق)";
const cancelling = new Set();
let warned = false;
function save(id, data, tdata) {
  const e = items.find(x => x.id === id);
  const b = writeBatch(db);
  b.update(doc(db, "waitlist", id), data);
  if (e && e.ticket && e.day && tdata) b.update(doc(db, "tickets", e.day + "_" + e.ticket), tdata);
  return b.commit().catch(err => {
    console.error(err);
    if (!warned) { warned = true; alert("تعذّر حفظ التغيير. تأكد من نشر قواعد Firebase الأخيرة ثم حاول مرة ثانية.\n\n" + (err && err.code ? err.code : "")); setTimeout(() => warned = false, 15000); }
    throw err;
  });
}
function cancelBooking(id) {
  if (cancelling.has(id)) return; cancelling.add(id);
  return save(id, { status: "cancelled", doneAt: serverTimestamp() }, { status: "cancelled" }).catch(() => setTimeout(() => cancelling.delete(id), 20000));
}
function mmss(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function tick() {
  items.forEach(e => {
    if (isDone(e) || isStale(e) || !e.calledAt) return;
    const left = e.calledAt + GRACE - Date.now();
    const el = root.querySelector('[data-cd="' + e.id + '"]');
    if (el) el.textContent = left > 0 ? "⏳ متبقي على الحضور " + mmss(left) : "انتهت المهلة، جاري إلغاء الحجز";
    if (left <= 0) cancelBooking(e.id);
  });
}

function exportCsv() {
  const rows = [["الاسم", "الجوال", "العدد", "وقت التسجيل", "الحالة"]].concat(items.map(e => [e.name, e.phone, e.count, fmt(e.createdAt), (isDone(e) || isStale(e)) ? label(e) : "ينتظر"]));
  const csv = "\uFEFF" + rows.map(r => r.map(v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"').join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "fnh-customers.csv"; document.body.appendChild(a); a.click(); a.remove();
}

function render() {
  const waiting = items.filter(e => !isDone(e) && !isStale(e));
  const stamp = x => x.doneAt ? x.doneAt.toMillis() : (x.createdAt ? x.createdAt.toMillis() : 0);
  const done = items.filter(e => isDone(e) || isStale(e)).sort((a, b) => stamp(b) - stamp(a));
  const h = ['<div class="brand sm"><img class="logo" src="logo.png" alt="FŇH"></div><div class="row" style="justify-content:space-between"><h1>قائمة الانتظار (' + waiting.length + ')</h1><button class="b o" id="out" style="width:auto;margin:0;padding:8px 12px;font-size:14px">خروج</button></div>'];
  if (!waiting.length) h.push('<p class="s">لا يوجد زبائن في الانتظار الآن.</p>');
  waiting.forEach((e, i) => {
    const mins = e.createdAt ? Math.max(0, Math.round((Date.now() - e.createdAt.toMillis()) / 60000)) : 0;
    const msg = "أهلاً " + e.name + "، طاولتك جاهزة الآن ☕\nفي حال التأخر 5 دقائق سيتم إلغاء الحجز تلقائياً 🌟";
    const wa = "https://wa.me/" + e.phone + "?text=" + encodeURIComponent(msg);
    const btns = e.calledAt
      ? '<a class="b" href="' + wa + '" target="_blank" rel="noopener">إعادة الإرسال</a><a class="b o" href="tel:+' + e.phone + '">اتصال</a><button class="b o" data-d="' + e.id + '">حضر</button><button class="b o" data-x="' + e.id + '">إلغاء الحجز</button>'
      : '<a class="b" href="' + wa + '" target="_blank" rel="noopener" data-c="' + e.id + '">استدعاء (5 د)</a><a class="b o" href="tel:+' + e.phone + '">اتصال</a><button class="b o" data-d="' + e.id + '">تم</button><button class="b o" data-x="' + e.id + '">إلغاء</button>';
    h.push('<div class="c"><div class="row"><span class="n">' + (i + 1) + '</span><div><b>' + esc(e.name) + '</b><div class="m">' + (e.ticket ? 'رقم ' + e.ticket + '، ' : '') + e.count + ' أشخاص، ينتظر منذ ' + mins + ' دقيقة</div></div></div>' +
      '<div class="m" dir="ltr" style="text-align:right;margin-top:6px">+' + esc(e.phone) + '</div>' +
      (e.calledAt ? '<div class="err" data-cd="' + e.id + '" style="font-weight:700"></div>' : '') +
      '<div class="a" style="flex-wrap:wrap">' + btns + '</div></div>');
  });
  let hist = '<div class="c"><details><summary>سجل الزبائن (' + done.length + ')</summary>';
  if (!done.length) hist += '<p class="m">لا يوجد سجل بعد. الزبون يُنقل هنا عند الضغط على "تم" أو إلغاء الحجز.</p>';
  done.slice(0, 100).forEach(e => {
    hist += '<div style="padding:10px 0;border-top:1px solid var(--bd)"><b>' + esc(e.name) + '</b> <span class="m">(' + e.count + ') - ' + label(e) + '</span><div class="m" dir="ltr" style="text-align:right">+' + esc(e.phone) + '</div><div class="m">' + fmt(e.createdAt) + '</div>' +
      '<a class="m" href="https://wa.me/' + e.phone + '" target="_blank" rel="noopener">واتساب</a></div>';
  });
  hist += '<button class="b o" id="csv">تصدير كل الزبائن (Excel)</button></details></div>';
  h.push(hist);
  h.push('<div class="c"><details><summary>باركود الزبائن</summary><div id="qr"></div><p class="m">اطبعه وعلّقه خارج المحل.</p></details></div>');
  root.innerHTML = h.join("");
  document.getElementById("out").onclick = () => signOut(auth);
  document.getElementById("csv").onclick = exportCsv;
  root.querySelectorAll("[data-d]").forEach(b => b.onclick = () => save(b.dataset.d, { status: "done", doneAt: serverTimestamp() }, { status: "done" }).catch(() => {}));
  root.querySelectorAll("[data-x]").forEach(b => b.onclick = () => { if (confirm("إلغاء هذا الحجز؟")) cancelBooking(b.dataset.x); });
  root.querySelectorAll("[data-c]").forEach(a => a.onclick = () => { (() => { const t = Date.now(); return save(a.dataset.c, { calledAt: t }, { status: "called", calledAt: t }); })().catch(() => {}); });
  try {
    const link = location.origin + location.pathname.replace(/[^\\/]*$/, "");
    const q = qrcode(0, "M"); q.addData(link); q.make();
    const el = document.getElementById("qr"); el.innerHTML = q.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
    const s = el.querySelector("svg"); if (s) { s.style.width = "240px"; s.style.height = "240px"; }
  } catch (e) {}
  tick();
}

function beep() {
  try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(); o.connect(c.destination); o.frequency.value = 880; o.start(); o.stop(c.currentTime + 0.2); } catch (e) {}
}

onAuthStateChanged(auth, user => {
  if (!user) return loginView();
  unsub = onSnapshot(query(collection(db, "waitlist"), orderBy("createdAt")), snap => {
    if (!first && snap.docChanges().some(c => c.type === "added" && !c.doc.metadata.hasPendingWrites)) beep();
    first = false;
    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, () => { root.innerHTML = '<p class="err">لا يمكن قراءة القائمة. تأكد أن قواعد Firestore منشورة.</p>'; });
});
setInterval(tick, 1000);
setInterval(() => { if (auth.currentUser && items.length) render(); }, 60000);
</script>
</body>
</html>
